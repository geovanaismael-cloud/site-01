<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Elegante</title>
    <!-- Importação de fonte moderna via Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Arquivo de estilos CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <div class="card">
            <!-- Imagem única estilizada via Unsplash -->
            <div class="image-wrapper">
                <img 
                    src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1000&q=80" 
                    alt="Paisagem natural com montanhas e lago ao pôr do sol" 
                    class="main-image"
                >
            </div>
            
            <!-- Conteúdo textual -->
            <div class="content">
                <span class="badge">Inspiração</span>
                <h1 class="title">Explore a Beleza da Natureza</h1>
                <p class="description">
                    Uma página simples e elegante projetada para destacar momentos visuais incríveis. Design minimalista com foco na clareza e na experiência do usuário.
                </p>
                
                <!-- Botão de ação -->
                <a href="#" class="button">Saber Mais</a>
            </div>
        </div>
    </main>

</body>
</html>
